# GitHub Actions: her PR'da ve main'e her eklemede projeyi denetler.
# Ne olduğunu bilmiyorsan: rehber/github-actions-nedir.md
name: kontrol

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/kontrol.mjs
