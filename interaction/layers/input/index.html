/* Playground çerçevesi. Yapı ve hareket interaction/reference/sidebar/style.css ile aynı;
   değerler Sidebar, Nav Item ve Nav Sub Group spec'lerindeki token'lar. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg-surface); color: var(--text-primary); font: var(--text-sm-regular); -webkit-font-smoothing: antialiased; overflow: hidden; }
#app { height: 100%; }
:root { --pg-ease: cubic-bezier(0.32, 0.72, 0, 1); --pg-dur: 0.4s; --pg-fast: 0.15s; }

.pg-app { display: flex; height: 100vh; min-height: 560px; }

/* ---------- Sidebar (Type=Expanded, 248) ---------- */
.sidebar { flex: none; width: 248px; height: 100%; display: flex; flex-direction: column; background: var(--bg-base); border-right: 1px solid var(--border-default); }
.sb-header { flex: none; display: flex; align-items: center; height: 56px; padding: var(--spacing-3-5) var(--spacing-7); border-bottom: 1px solid var(--border-default); }
.logo { display: flex; align-items: center; gap: var(--spacing-2); border-radius: var(--rounded-md); }
.logo svg { display: block; flex: none; }
.logo:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

.sb-nav { flex: 1; min-height: 0; overflow: hidden auto; scrollbar-width: thin; display: flex; flex-direction: column; gap: var(--spacing-3); padding: var(--spacing-4); }
.sb-group { display: flex; flex-direction: column; gap: var(--spacing-0-5); }
.group-label { height: 28px; flex: none; display: flex; align-items: center; padding: var(--spacing-1-5) var(--spacing-2-5); }
.group-label p { margin: 0; font: var(--text-xs-medium); color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Nav Item, Level=Item */
.item { position: relative; flex: none; display: flex; align-items: center; gap: var(--spacing-2-5); width: 100%; height: 36px; padding: var(--spacing-2) var(--spacing-2-5); margin: 0; overflow: hidden;
  border: 1px solid transparent; border-radius: var(--rounded-lg); background: transparent; cursor: pointer; text-align: left;
  color: var(--text-secondary); font: var(--text-sm-medium); white-space: nowrap;
  transition: background-color var(--pg-fast) ease, color var(--pg-fast) ease; }
.item:hover { background: var(--bg-interactive-hover); color: var(--text-primary); }
.item:active { background: var(--bg-interactive-pressed); }
.item.selected { background: var(--bg-surface); border-color: var(--border-default); color: var(--text-primary); }
.item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--border-focus); }
.item .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.item .caret { flex: none; display: flex; }
.item .caret .tds-icon { transition: transform 0.2s ease-out; }
.item.closed .caret .tds-icon { transform: rotate(180deg); }

/* Nav Sub Group: açılır alan, içinde property kontrolleri */
.sub { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows var(--pg-dur) var(--pg-ease), opacity var(--pg-dur) var(--pg-ease); }
.sub.shut { grid-template-rows: 0fr; opacity: 0; pointer-events: none; visibility: hidden; transition: grid-template-rows var(--pg-dur) var(--pg-ease), opacity var(--pg-dur) var(--pg-ease), visibility 0s linear var(--pg-dur); }
.sub > div { min-height: 0; overflow: hidden; }
.sub-wrap { padding: var(--spacing-1-5) 0 var(--spacing-1-5) var(--spacing-4-5); }
.sub-list { display: flex; flex-direction: column; gap: var(--spacing-3); padding: var(--spacing-1) 0 var(--spacing-1) var(--spacing-2); border-left: 1px solid var(--border-default); }

/* Kontroller (Select Small ve Input Small görünümünde) */
.pg-field { display: flex; flex-direction: column; gap: var(--spacing-1); padding-left: var(--spacing-2); }
.pg-field > span:first-child, .pg-check > span { font: var(--text-xs-medium); color: var(--text-secondary); }
.pg-select { position: relative; display: flex; }
.pg-select .tds-icon { position: absolute; right: var(--spacing-2-5); top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
.pg-field select, .pg-field input { width: 100%; height: 32px; padding: 0 var(--spacing-2-5); font: var(--text-sm-regular); color: var(--text-primary); background: var(--bg-surface);
  border: 1px solid var(--border-default); border-radius: var(--rounded-md); appearance: none; -webkit-appearance: none; }
.pg-field select { padding-right: var(--spacing-8); cursor: pointer; }
.pg-field select:focus-visible, .pg-field input:focus-visible { outline: none; border-color: var(--border-selected); }
.pg-check { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-2); padding-left: var(--spacing-2); min-height: 24px; cursor: pointer; }
.pg-check input { appearance: none; -webkit-appearance: none; flex: none; width: 28px; height: 16px; margin: 0; border-radius: var(--rounded-full); background: var(--border-strong); position: relative; cursor: pointer; transition: background-color var(--pg-fast) ease; }
.pg-check input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: var(--rounded-full); background: var(--bg-surface); transition: transform var(--pg-fast) ease; }
.pg-check input:checked { background: var(--action-primary-default); }
.pg-check input:checked::after { transform: translateX(12px); background: var(--text-inverse); }
.pg-check input:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

.sb-footer { flex: none; padding: var(--spacing-4); border-top: 1px solid var(--border-default); }

/* ---------- Sahne ---------- */
.pg-stage { position: relative; flex: 1; min-width: 0; height: 100%; background: var(--bg-surface); outline: none; }
.pg-canvas { position: absolute; inset: 0; overflow: auto; display: grid; place-items: center; padding: var(--spacing-16); }
.pg-preview { position: relative; display: flex; align-items: center; justify-content: center; transform: scale(var(--zoom, 1)); transform-origin: center; transition: transform 0.2s var(--pg-ease); }

.pg-zoom { position: absolute; right: var(--spacing-4); bottom: var(--spacing-4); display: flex; align-items: center; gap: var(--spacing-0-5); padding: var(--spacing-0-5);
  background: var(--bg-raised); border-radius: var(--rounded-lg); box-shadow: inset 0 0 0 1px var(--border-default), var(--shadow-sm); }
.pg-zoom button { display: inline-flex; align-items: center; justify-content: center; height: 28px; min-width: 28px; padding: 0 var(--spacing-1-5); border: 0; margin: 0; border-radius: var(--rounded-md);
  background: transparent; color: var(--text-secondary); font: var(--text-xs-medium); cursor: pointer; transition: background-color var(--pg-fast) ease, color var(--pg-fast) ease; }
.pg-zoom button:hover:not(:disabled) { background: var(--bg-interactive-hover); color: var(--text-primary); }
.pg-zoom button:active:not(:disabled) { background: var(--bg-interactive-pressed); }
.pg-zoom button:disabled { opacity: var(--opacity-50); cursor: not-allowed; }
.pg-zoom button:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 0; }
.pg-zoom-value { min-width: 48px !important; font-variant-numeric: tabular-nums; }

/* ---------- Komponentlerin ortak parçaları ---------- */
.tds-icon { display: inline-flex; flex: none; width: 1em; height: 1em; font-size: 16px; line-height: 1; align-items: center; justify-content: center; }
.tds-icon svg { display: block; width: 1em; height: 1em; }
.tds-flag { display: inline-block; flex: none; border-radius: var(--rounded-full); }
/* Sahne örnekleri: kontrol + Label (Checkbox & Radio spec: 8 px aralık) */
.pg-choices { display: flex; flex-direction: column; gap: var(--spacing-3); }
.pg-choice { display: flex; align-items: flex-start; gap: var(--spacing-2); }
.pg-choice > .tds-checkbox, .pg-choice > .tds-radio { margin-top: var(--spacing-0-5); }
.tds-popover { position: absolute; z-index: 1000; animation: tds-pop-in var(--tds-motion-duration) var(--tds-motion-easing); }
@keyframes tds-pop-in { from { opacity: 0; transform: translateY(-4px); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; transition-delay: 0ms !important; animation-duration: 0.01ms !important; } }

/* input: components/input/spec.md */
.tds-input { position: relative; display: flex; align-items: center; box-sizing: border-box; width: 320px; max-width: 100%; margin: 0; cursor: text;
  background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--border-default); transition: var(--tds-transition); }
.tds-input-field { flex: 1; min-width: 0; width: 100%; height: 100%; padding: 0; margin: 0; border: 0; outline: none; background: transparent; font: inherit; color: var(--text-primary); text-overflow: ellipsis; }
.tds-input-field::placeholder { color: var(--text-tertiary); opacity: 1; }
.tds-input[data-align="center"] .tds-input-field { text-align: center; }
.tds-input .tds-icon { flex: none; transition: color var(--tds-motion-duration) var(--tds-motion-easing); }
.tds-input-leading, .tds-input-trailing { display: flex; align-items: center; flex: none; align-self: stretch; }
.tds-input-clear { display: inline-flex; flex: none; padding: 0; border: 0; margin: 0; background: transparent; color: inherit; cursor: pointer; border-radius: var(--rounded-sm); }
.tds-input-clear:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }
.tds-input-counter { flex: none; font: var(--text-xs-regular); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.tds-input[data-state="disabled"] { cursor: not-allowed; }
.tds-input[data-state="disabled"] .tds-input-field { cursor: not-allowed; }
.tds-input[data-size="small"] { height: 32px; padding: 0 var(--spacing-2-5); gap: var(--spacing-2); border-radius: var(--rounded-md); font: var(--text-sm-regular); }
.tds-input[data-size="medium"] { height: 36px; padding: 0 var(--spacing-3); gap: var(--spacing-2); border-radius: var(--rounded-lg); font: var(--text-sm-regular); }
.tds-input[data-size="large"] { height: 40px; padding: 0 var(--spacing-3); gap: var(--spacing-2); border-radius: var(--rounded-lg); font: var(--text-sm-regular); }
.tds-input .tds-icon[data-part="leading-icon"] { font-size: 16px; color: var(--text-secondary); }
.tds-input:has(.tds-input-field:placeholder-shown) .tds-icon[data-part="leading-icon"] { color: var(--text-tertiary); }
.tds-input .tds-icon[data-part="trailing-icon"] { font-size: 16px; color: var(--text-secondary); }
.tds-input:has(.tds-input-field:placeholder-shown) .tds-icon[data-part="trailing-icon"] { color: var(--text-tertiary); }
.tds-input .tds-icon[data-part="status-icon"] { font-size: 16px; color: var(--feedback-success-text); }
.tds-input[data-state="default"] { background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--border-default); }
.tds-input[data-state="focused"], .tds-input:not([data-state]):focus-within { background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--border-selected); }
.tds-input[data-state="filled"] { background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--border-default); }
.tds-input[data-state="error"] { background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--border-danger); }
.tds-input[data-state="success"] { background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--border-success); }
.tds-input[data-state="disabled"] { background: var(--bg-disabled); box-shadow: inset 0 0 0 1px var(--border-default); }
.tds-input[data-state="disabled"] > * { opacity: var(--opacity-50); }
.tds-input[data-state="read-only"] { background: var(--bg-base); box-shadow: inset 0 0 0 1px var(--border-default); }

</style>

// Phosphor paketinde olmayan özel ikonlar (Figma → Icons sayfası → Custom Icons).
// Phosphor ikonları buraya yazılmaz; build onları lib/icons.mjs ile gömer.
// Yeni özel ikon: Figma'dan 32×32 SVG olarak dışa aktar, sadece <path> kısımlarını fill'siz yaz (currentColor ile boyanır).
window.TDS_ICONS = {};
// Tarayıcı tarafı temel: komponent kayıt defteri, ikonlar, spec okuma ve açılır menü.
// Kurallar: rules/core/interaction/code-layer.md
(function () {
  const comps = {};
  const menus = {};
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  const TDS = {
    esc,
    slug,
    register(name, def) { comps[name] = def; },
    get(name) { return comps[name]; },
    // HTML string döndürür. İç içe komponentler birbirini bununla çağırır.
    render(name, props) {
      if (!comps[name]) throw new Error(`"${name}" komponenti bu sayfaya eklenmemiş (page.json → components)`);
      return comps[name].render({ ...comps[name].defaults, ...props });
    },

    // İkon: Figma'daki Icons sayfasıyla aynı paket (Phosphor), build sırasında SVG olarak gömülür.
    // Weight: "Regular" veya "Fill". Boyut verilmezse komponentin CSS'i (spec'teki Icon sütunu) belirler.
    // SVG'nin kendi boyutu 1em'dir: CSS yüklenmese bile ikon yazı boyutunu aşmaz.
    // attrs: ikonun kendisine eklenecek nitelikler (ör. 'data-part="submenu"'). İkon ekstra bir kutuya sarılmaz,
    // yoksa satır yüksekliği yüzünden 16×16 ikon 16×20 kutuda durur.
    icon(name, size, weight = 'Regular', attrs = '') {
      const st = size ? ` style="font-size:${size}px"` : '';
      const custom = (window.TDS_ICONS || {})[name];
      const paths = custom || ((window.TDS_PHOSPHOR || {})[weight] || {})[name];
      if (!paths) {
        console.warn(`TDS.icon: "${name}" (${weight}) bu sayfaya gömülmemiş. interaction/shared/icon-list.json dosyasına ekleyip build'i çalıştır.`);
        return `<span class="tds-icon" aria-hidden="true"${st} title="${esc(name)}"></span>`;
      }
      const viewBox = custom ? '0 0 32 32' : '0 0 256 256';
      // Boyut verildiyse SVG'ye px olarak yazılır: CSS'ten bağımsız, Figma'daki ikon boyutuyla birebir.
      const dim = size ? `${size}px` : '1em';
      const box = size ? ` style="width:${size}px;height:${size}px;font-size:${size}px"` : '';
      return `<span class="tds-icon"${attrs ? " " + attrs : ""} aria-hidden="true"${box}><svg width="${dim}" height="${dim}" viewBox="${viewBox}" fill="currentColor" focusable="false">${paths}</svg></span>`;
    },
    // Spec tablosu satırı: TDS.spec('button', 'Sizes', 'size', 'Medium') → { size, height, icon, ... }
    // Komponentler ikon boyutunu buradan alır, böylece Figma'daki komponentle aynı olur.
    spec(name, heading, key, value, index = 0) {
      const t = ((window.TDS_SPEC || {})[name] || {})[heading];
      const rows = (t && t[index]) || [];
      return key ? (rows.find((r) => String(r[key]).toLowerCase() === String(value).toLowerCase()) || {}) : rows;
    },
    // "16 (`Spacing/4`)" → 16, "`Spacing/3` (12)" → 12 (lib/spec.mjs → v.num ile aynı)
    num(cell) { const n = ((cell) => { const s = String(cell == null ? '' : cell).trim(); const lead = /^-?\d+(?:\.\d+)?/.exec(s); if (lead) return parseFloat(lead[0]); const par = /\((\d+(?:\.\d+)?)\)/.exec(s); if (par) return parseFloat(par[1]); const any = /\d+(?:\.\d+)?/.exec(s); return any ? parseFloat(any[0]) : NaN; })(cell); return Number.isFinite(n) ? n : undefined; },
    iconNames(weight = 'Regular') { return Object.keys((window.TDS_PHOSPHOR || {})[weight] || {}); },
    // Bayrak: Figma'daki Flags (circle-flags). Kod: "TR", "DE"…
    flag(code, size = 14) {
      return `<img class="tds-flag" src="https://hatscripts.github.io/circle-flags/flags/${String(code).toLowerCase()}.svg" width="${size}" height="${size}" alt="">`;
    },

    // Açılır menü. Bir tetikleyiciye data-tds-menu="<isim>" verilir; menü içeriği TDS.menus ile tanımlanır.
    menus,
    defineMenu(name, props) { menus[name] = props; },
    closeMenu(returnFocus) {
      const open = document.querySelector('.tds-popover');
      if (!open) return;
      const trigger = open._trigger;
      open.remove();
      if (trigger) { trigger.setAttribute('aria-expanded', 'false'); if (returnFocus) trigger.focus(); }
    },
    // Açılan katmanı (menü, tooltip) tetikleyicinin yanına koyar. Tetikleyici yakınlaştırılmış sahnedeyse
    // ([data-tds-layer]) katman da sahnenin içine girer, böylece aynı ölçekte durur ve yerinden kaymaz.
    place(trigger, el, fn) {
      const layer = trigger.closest('[data-tds-layer]');
      const box = layer || document.body;
      box.appendChild(el);
      const c = layer ? layer.getBoundingClientRect() : { top: -window.scrollY, left: -window.scrollX };
      const s = layer && layer.offsetWidth ? c.width / layer.offsetWidth : 1;
      const t = trigger.getBoundingClientRect();
      const r = { top: (t.top - c.top) / s, bottom: (t.bottom - c.top) / s, left: (t.left - c.left) / s, right: (t.right - c.left) / s, width: t.width / s, height: t.height / s };
      const pos = fn(r, { width: el.offsetWidth, height: el.offsetHeight });
      if (!layer) pos.left = Math.max(8, pos.left);
      return pos;
    },
    openMenu(trigger) {
      TDS.closeMenu();
      const name = trigger.dataset.tdsMenu;
      const props = typeof menus[name] === 'function' ? menus[name](trigger) : menus[name];
      if (!props) return;
      const pop = document.createElement('div');
      pop.className = 'tds-popover';
      pop._trigger = trigger;
      pop.innerHTML = TDS.render('menu', props);
      const gap = 4; // Menu spec: "Opens 4 px below its trigger"
      const align = trigger.dataset.tdsAlign || 'start';
      const { top, left } = TDS.place(trigger, pop, (r, p) => ({ top: r.bottom + gap, left: align === 'end' ? r.right - p.width : r.left }));
      pop.style.top = `${top}px`;
      pop.style.left = `${left}px`;
      trigger.setAttribute('aria-expanded', 'true');
      const first = pop.querySelector('[role="menuitem"]:not([aria-disabled="true"])');
      if (first) first.focus();
    },

    // Durumlu komponentler (takvim, filtre grubu, tag input…): kök elemanda data-tds-comp ve data-tds-props durur.
    // TDS.update(el, { ... }) props'u değiştirip komponenti yeniden çizer ve odağı aynı parçaya geri verir.
    props(p) { return ` data-tds-props="${esc(JSON.stringify(p))}"`; },
    read(el) { return JSON.parse(el.dataset.tdsProps || '{}'); },
    update(el, patch, focus) {
      const name = el.dataset.tdsComp;
      const next = { ...TDS.read(el), ...patch };
      const tmp = document.createElement('div');
      tmp.innerHTML = TDS.render(name, next);
      const fresh = tmp.firstElementChild;
      el.replaceWith(fresh);
      if (focus) { const f = fresh.querySelector(focus); if (f) { f.focus(); if (f.setSelectionRange && f.value != null) f.setSelectionRange(f.value.length, f.value.length); } }
      return fresh;
    },

    // Tooltip: tetikleyiciye data-tds-tooltip="Metin" verilir. Üzerinde ~500 ms durunca veya klavye odağında açılır
    // (components/tooltip/spec.md). Çizimi tooltip komponenti yapar.
    tooltipDelay: 500,

    // Playground arayüzü shared/playground.js dosyasında: TDS.playground(mount, page).
  };

  // Tooltip davranışı.
  let tipTimer = null;
  const hideTip = () => { clearTimeout(tipTimer); document.querySelectorAll('.tds-tooltip-layer').forEach((t) => t.remove()); };
  const showTip = (trigger) => {
    hideTip();
    if (!comps.tooltip) return;
    const layer = document.createElement('div');
    layer.className = 'tds-tooltip-layer';
    const placement = trigger.dataset.tdsPlacement || 'Top';
    layer.innerHTML = TDS.render('tooltip', { Text: trigger.dataset.tdsTooltip, 'Show Shortcut': false, Placement: placement });
    const gap = 4;
    const pos = TDS.place(trigger, layer, (r, t) => ({
      Top: { left: r.left + r.width / 2 - t.width / 2, top: r.top - t.height - gap },
      Bottom: { left: r.left + r.width / 2 - t.width / 2, top: r.bottom + gap },
      Left: { left: r.left - t.width - gap, top: r.top + r.height / 2 - t.height / 2 },
      Right: { left: r.right + gap, top: r.top + r.height / 2 - t.height / 2 },
    }[placement]));
    layer.style.left = `${pos.left}px`;
    layer.style.top = `${pos.top}px`;
    requestAnimationFrame(() => layer.classList.add('is-open'));
  };
  document.addEventListener('pointerover', (e) => {
    const t = e.target.closest('[data-tds-tooltip]');
    if (!t) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => showTip(t), TDS.tooltipDelay);
  });
  document.addEventListener('pointerout', (e) => { if (e.target.closest('[data-tds-tooltip]')) hideTip(); });
  document.addEventListener('focusin', (e) => { const t = e.target.closest && e.target.closest('[data-tds-tooltip]'); if (t && t.matches(':focus-visible')) showTip(t); });
  document.addEventListener('focusout', (e) => { if (e.target.closest && e.target.closest('[data-tds-tooltip]')) hideTip(); });

  // Menü davranışı: tıklama, klavye (oklar, Enter, Escape, Tab) ve dışarı tıklama.
  document.addEventListener('click', (e) => {
    const trigger = e.target.closest('[data-tds-menu]');
    if (trigger && !trigger.disabled) {
      const isOpen = trigger.getAttribute('aria-expanded') === 'true';
      if (isOpen) TDS.closeMenu(); else TDS.openMenu(trigger);
      return;
    }
    const item = e.target.closest('.tds-popover [role="menuitem"]');
    if (item) {
      if (item.getAttribute('aria-disabled') === 'true') return;
      // Seçilen satır tetikleyiciye bildirilir (Select, Phone Field, takvim başlığı değeri buradan alır).
      const trigger = item.closest('.tds-popover')._trigger;
      const value = item.dataset.value || item.querySelector('.tds-menu-item-label')?.textContent || '';
      TDS.closeMenu(true);
      if (trigger && trigger.isConnected) trigger.dispatchEvent(new CustomEvent('tds-menu-select', { bubbles: true, detail: { value } }));
      return;
    }
    if (!e.target.closest('.tds-popover')) TDS.closeMenu();
  });
  document.addEventListener('keydown', (e) => {
    const pop = document.querySelector('.tds-popover');
    if (!pop) return;
    const items = [...pop.querySelectorAll('[role="menuitem"]:not([aria-disabled="true"])')];
    const i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); TDS.closeMenu(true); }
    else if (e.key === 'Tab') TDS.closeMenu();
    else if (e.key === 'ArrowDown') { e.preventDefault(); (items[i + 1] || items[0])?.focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); (items[i - 1] || items[items.length - 1])?.focus(); }
    else if (e.key === 'Home') { e.preventDefault(); items[0]?.focus(); }
    else if (e.key === 'End') { e.preventDefault(); items[items.length - 1]?.focus(); }
    else if ((e.key === 'Enter' || e.key === ' ') && i >= 0) { e.preventDefault(); items[i].click(); }
  });

  window.TDS = TDS;
})();
// Playground arayüzü. Yapı ve hareket interaction/reference/sidebar/ (Sidebar Interaction code layer) ile aynı:
// solda Sidebar (Expanded, daralmaz), her komponent bir Nav Item; tıklanınca altında Nav Sub Group gibi açılır
// ve içinde o komponentin property'leri bulunur. Sağda kalan alanın tamamı sahne; köşede yakınlaştırma.
(function () {
  const { esc, slug } = TDS;
  const ZOOMS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4];

  // tabii logosu (Logo, Type=Full). Renkler token: işaret bg/inverse + text/inverse, yazı text/primary.
  const LOGO = `<svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M22 0H6C2.686 0 0 2.686 0 6V22C0 25.314 2.686 28 6 28H22C25.314 28 28 25.314 28 22V6C28 2.686 25.314 0 22 0Z" fill="var(--bg-inverse)"/><path d="M22.451 14.024L24 10.099L19.634 8.397L17.897 4L14 5.56L10.056 4L8.366 8.35L4 10.099L5.549 14.024L4 17.948L8.366 19.65L10.056 24L13.953 22.44L17.85 24L19.54 19.65L23.906 17.948L22.451 14.024ZM14.845 16.955L14 19.083L13.155 16.955L9.728 18.326L11.089 14.875L8.977 14.024L11.089 13.173L9.728 9.721L13.155 11.092L14 8.965L14.845 11.092L18.272 9.721L16.911 13.173L19.024 14.024L16.911 14.875L18.272 18.326L14.845 16.955Z" fill="var(--text-inverse)"/></svg>
<svg class="pg-wordmark" width="46" height="28" viewBox="36 0 46 28" fill="none" aria-label="tabii"><path d="M72.993 6.059V9.406H76.454V6.059H72.993ZM72.993 10.427V22.569H76.454V10.427H72.993Z" fill="var(--text-primary)"/><path d="M78.27 6.059V9.406H81.73V6.059H78.27ZM78.27 10.427V22.569H81.73V10.427H78.27Z" fill="var(--text-primary)"/><path d="M42.809 13.376V10.199H39.461V6H36V19.333C36 21.092 37.418 22.511 39.177 22.511H42.752V19.333H39.404V13.376H42.809Z" fill="var(--text-primary)"/><path d="M53.305 10.197V11.559C52.283 10.651 50.978 10.141 49.56 10.141C46.269 10.141 43.659 12.978 43.659 16.495C43.659 20.013 46.326 22.85 49.56 22.85C50.978 22.85 52.283 22.339 53.305 21.431V22.623H56.766V10.197H53.305ZM53.305 19.389H47.29V13.375H53.305V19.389Z" fill="var(--text-primary)"/><path d="M65.56 10.144C64.142 10.144 62.837 10.654 61.816 11.562V6.059H58.355V22.569H61.816V21.378C62.837 22.286 64.142 22.796 65.56 22.796C68.851 22.796 71.461 19.959 71.461 16.442C71.461 12.981 68.794 10.144 65.56 10.144ZM67.83 19.392H61.816V13.378H67.83V19.392Z" fill="var(--text-primary)"/></svg>`;

  TDS.playground = function (mount, page) {
    const root = typeof mount === 'string' ? document.querySelector(mount) : mount;
    const state = {};
    page.components.forEach((c) => { state[c.name] = Object.fromEntries(c.controls.map((k) => [k.key, k.default])); });
    let active = page.components[0].name;
    const open = new Set([active]);
    let zoom = 1;

    const visible = (c, k) => !k.when || k.when(state[c.name]);
    const control = (c, k) => {
      const val = state[c.name][k.key];
      const id = `ctl-${c.name}-${slug(k.key)}`;
      const label = esc(k.label || k.key);
      if (k.type === 'bool') {
        return `<label class="pg-check" for="${id}"><span>${label}</span><input id="${id}" type="checkbox" role="switch" data-comp="${c.name}" data-key="${esc(k.key)}" ${val ? 'checked' : ''}></label>`;
      }
      if (k.type === 'select') {
        return `<label class="pg-field" for="${id}"><span>${label}</span><span class="pg-select">${'<select id="' + id + '" data-comp="' + c.name + '" data-key="' + esc(k.key) + '">'}${k.options.map((o) => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>${TDS.icon('CaretDown', 16)}</span></label>`;
      }
      return `<label class="pg-field" for="${id}"><span>${label}</span><input id="${id}" type="text" data-comp="${c.name}" data-key="${esc(k.key)}" value="${esc(val)}"></label>`;
    };
    const controls = (c) => c.controls.filter((k) => visible(c, k)).map((k) => control(c, k)).join('');

    const navItem = (c) => {
      const isOpen = open.has(c.name);
      return `<button type="button" class="item${c.name === active ? ' selected' : ''}${isOpen ? '' : ' closed'}" data-item="${c.name}" aria-expanded="${isOpen}" aria-controls="sub-${c.name}"${c.name === active ? ' aria-current="page"' : ''}>`
        + `<span class="text">${esc(c.label)}</span><span class="caret">${TDS.icon('CaretUp', 16)}</span></button>`
        + `<div class="sub${isOpen ? '' : ' shut'}" id="sub-${c.name}"><div><div class="sub-wrap"><div class="sub-list" data-controls="${c.name}">${controls(c)}</div></div></div></div>`;
    };

    const shell = () => {
      const dark = document.documentElement.dataset.theme === 'dark';
      root.innerHTML = `
        <div class="pg-app">
          <aside class="sidebar" aria-label="${esc(page.title)} components">
            <div class="sb-header"><a class="logo" href="#" aria-label="tabii CMS Design System" onclick="return false">${LOGO}</a></div>
            <nav class="sb-nav"><div class="sb-group">
              <div class="group-label"><p>${esc(page.title.toUpperCase())}</p></div>
              ${page.components.map(navItem).join('')}
            </div></nav>
            <div class="sb-footer">
              <button type="button" class="item" data-theme-toggle aria-pressed="${dark}">${TDS.icon(dark ? 'Sun' : 'Moon', 20)}<span class="text">${dark ? 'Light mode' : 'Dark mode'}</span></button>
            </div>
          </aside>
          <main class="pg-stage" aria-label="Preview" tabindex="-1">
            <div class="pg-canvas"><div class="pg-preview" data-tds-layer style="--zoom:${zoom}">${TDS.render(active, state[active])}</div></div>
            <div class="pg-zoom" role="group" aria-label="Zoom">
              <button type="button" data-zoom="out" aria-label="Zoom out"${zoom <= ZOOMS[0] ? ' disabled' : ''}>${TDS.icon('Minus', 16)}</button>
              <button type="button" data-zoom="reset" class="pg-zoom-value" aria-label="Reset zoom to 100%">${Math.round(zoom * 100)}%</button>
              <button type="button" data-zoom="in" aria-label="Zoom in"${zoom >= ZOOMS[ZOOMS.length - 1] ? ' disabled' : ''}>${TDS.icon('Plus', 16)}</button>
            </div>
          </main>
        </div>`;
    };

    // Sadece sahneyi yeniler (kontroller yerinde kalır, odak kaybolmaz).
    const renderStage = () => {
      TDS.closeMenu();
      root.querySelector('.pg-preview').innerHTML = TDS.render(active, state[active]);
    };
    const setZoom = (z) => {
      TDS.closeMenu();
      zoom = Math.min(ZOOMS[ZOOMS.length - 1], Math.max(ZOOMS[0], z));
      root.querySelector('.pg-preview').style.setProperty('--zoom', zoom);
      root.querySelector('.pg-zoom-value').textContent = `${Math.round(zoom * 100)}%`;
      root.querySelector('[data-zoom="out"]').disabled = zoom <= ZOOMS[0];
      root.querySelector('[data-zoom="in"]').disabled = zoom >= ZOOMS[ZOOMS.length - 1];
    };
    const step = (dir) => {
      const i = ZOOMS.findIndex((z) => z >= zoom - 1e-6);
      setZoom(dir > 0 ? ZOOMS[Math.min(ZOOMS.length - 1, ZOOMS[i] > zoom + 1e-6 ? i : i + 1)] : ZOOMS[Math.max(0, i - 1)]);
    };

    const refreshControls = (name) => {
      const c = page.components.find((x) => x.name === name);
      root.querySelector(`[data-controls="${name}"]`).innerHTML = controls(c);
    };

    root.addEventListener('click', (e) => {
      const item = e.target.closest('[data-item]');
      if (item) {
        const name = item.dataset.item;
        if (name !== active) {
          // Başka bir komponent seçildi: onu göster ve aç, diğerlerini kapat.
          active = name;
          for (const o of [...open]) {
            open.delete(o);
            const b = root.querySelector(`[data-item="${o}"]`);
            b.classList.add('closed'); b.setAttribute('aria-expanded', 'false');
            root.querySelector(`#sub-${o}`).classList.add('shut');
          }
          open.add(name);
          root.querySelectorAll('[data-item]').forEach((b) => {
            const on = b.dataset.item === name;
            b.classList.toggle('selected', on);
            if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
          });
          renderStage();
        } else if (open.has(name)) open.delete(name); else open.add(name);
        const isOpen = open.has(name);
        item.classList.toggle('closed', !isOpen);
        item.setAttribute('aria-expanded', String(isOpen));
        root.querySelector(`#sub-${name}`).classList.toggle('shut', !isOpen);
        return;
      }
      if (e.target.closest('[data-theme-toggle]')) {
        const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark';
        shell();
        return;
      }
      const z = e.target.closest('[data-zoom]');
      if (z) { if (z.dataset.zoom === 'reset') setZoom(1); else step(z.dataset.zoom === 'in' ? 1 : -1); }
    });
    root.addEventListener('input', (e) => {
      const el = e.target.closest('[data-key]');
      if (!el || el.type !== 'text') return;
      state[el.dataset.comp][el.dataset.key] = el.value;
      if (el.dataset.comp === active) renderStage();
    });
    root.addEventListener('change', (e) => {
      const el = e.target.closest('[data-key]');
      if (!el || el.type === 'text') return;
      const name = el.dataset.comp;
      state[name][el.dataset.key] = el.type === 'checkbox' ? el.checked : el.value;
      const focusKey = el.dataset.key;
      refreshControls(name); // "when" ile görünen kontroller değişebilir
      const again = root.querySelector(`[data-comp="${name}"][data-key="${focusKey}"]`);
      if (again) again.focus();
      if (name !== active) {
        active = name;
        root.querySelectorAll('[data-item]').forEach((b) => b.classList.toggle('selected', b.dataset.item === name));
      }
      renderStage();
    });
    // Sahnede Ctrl/⌘ + tekerlek veya + / − / 0 tuşları ile yakınlaştırma.
    root.addEventListener('wheel', (e) => {
      if (!(e.ctrlKey || e.metaKey) || !e.target.closest('.pg-stage')) return;
      e.preventDefault(); step(e.deltaY < 0 ? 1 : -1);
    }, { passive: false });
    window.addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('input, select, textarea')) return;
      if (e.key === '+' || e.key === '=') step(1);
      else if (e.key === '-') step(-1);
      else if (e.key === '0') setZoom(1);
    });

    shell();
  };
})();

// input
// Input. Gerçek bir <input>: yazılabilir, Trailing Icon (X) alanı temizler, Counter yazdıkça sayar.
// State=Live: boş alan, Value placeholder olarak görünür; yazınca Filled, odakta Focused olur.
// Sabit state'lerde Default placeholder'ı, diğerleri Value'yu değer olarak gösterir.
// İç kullanım (diğer komponentler): id, width, align ('center'), leading / trailing (slot HTML'i),
// placeholder, value, inputmode, describedby, invalid, attrs.
TDS.register('input', {
  defaults: { Size: 'Medium', State: 'Live', Value: 'Placeholder text', 'Show Value': true, 'Leading Icon': false, 'Leading Icon Swap': 'MagnifyingGlass', 'Trailing Icon': false, 'Trailing Icon Swap': 'X', Counter: false, 'Counter Text': '0/80', id: '', width: '', align: '', leading: '', trailing: '', placeholder: '', value: null, inputmode: '', describedby: '', label: '', attrs: '' },
  render(p) {
    const st = p.State && p.State !== 'Live' ? TDS.slug(p.State) : '';
    const size = (part) => TDS.num(TDS.spec('input', 'Parts', 'part', part).size); // 16
    const empty = st === 'default';
    const value = p.value != null ? p.value : (st && !empty ? p.Value : '');
    const placeholder = p.placeholder || (empty || !st ? p.Value : '');
    const dis = st === 'disabled' ? ' disabled' : '';
    const ro = st === 'read-only' ? ' readonly' : '';
    const max = TDS.num(String(p['Counter Text']).split('/')[1]);
    const count = p.Counter ? `<span class="tds-input-counter" aria-live="polite">${TDS.esc(st ? p['Counter Text'] : `${value.length}/${max || ''}`)}</span>` : '';
    const trailingIcon = !p['Trailing Icon'] ? ''
      : p['Trailing Icon Swap'] === 'X'
        ? `<button type="button" class="tds-input-clear" data-tds-clear aria-label="Clear"${dis || ro ? ' disabled' : ''}>${TDS.icon('X', size('Trailing Icon'), 'Regular', 'data-part="trailing-icon"')}</button>`
        : TDS.icon(p['Trailing Icon Swap'], size('Trailing Icon'), 'Regular', 'data-part="trailing-icon"');
    const aria = [p.label ? ` aria-label="${TDS.esc(p.label)}"` : '', p.describedby ? ` aria-describedby="${TDS.esc(p.describedby)}"` : '', st === 'error' || p.invalid ? ' aria-invalid="true"' : ''].join('');
    const field = p['Show Value'] ? `<input class="tds-input-field" type="text"${p.id ? ` id="${TDS.esc(p.id)}"` : ''} value="${TDS.esc(value)}" placeholder="${TDS.esc(placeholder)}"${p.inputmode ? ` inputmode="${p.inputmode}"` : ''}${max && p.Counter ? ` data-max="${max}"` : ''}${aria}${dis}${ro}${p.attrs ? ' ' + p.attrs : ''}>` : '';
    const width = p.width ? ` style="width:${TDS.esc(p.width)}${/^\d+$/.test(p.width) ? 'px' : ''}"` : '';
    return `<label class="tds-input" data-size="${TDS.slug(p.Size)}"${st ? ` data-state="${st}"` : ''}${p.align ? ` data-align="${p.align}"` : ''}${width}>`
      + (p['Leading Icon'] ? TDS.icon(p['Leading Icon Swap'], size('Leading Icon'), 'Regular', 'data-part="leading-icon"') : '')
      + (p.leading ? `<span class="tds-input-leading">${p.leading}</span>` : '')
      + field
      + count
      + (st === 'success' ? TDS.icon('CheckCircle', size('Status Icon'), 'Regular', 'data-part="status-icon"') : '')
      + trailingIcon
      + (p.trailing ? `<span class="tds-input-trailing">${p.trailing}</span>` : '')
      + `</label>`;
  },
});

// Temizle düğmesi ve canlı sayaç.
document.addEventListener('click', (e) => {
  const clear = e.target.closest('[data-tds-clear]');
  if (!clear) return;
  e.preventDefault();
  const field = clear.closest('.tds-input').querySelector('.tds-input-field');
  if (!field) return;
  field.value = '';
  field.dispatchEvent(new Event('input', { bubbles: true }));
  field.focus();
});
document.addEventListener('input', (e) => {
  const field = e.target.closest && e.target.closest('.tds-input-field[data-max]');
  if (!field) return;
  const c = field.closest('.tds-input').querySelector('.tds-input-counter');
  if (c) c.textContent = `${field.value.length}/${field.dataset.max}`;
});

// page
// Input sayfasının playground'u.
TDS.playground('#app', {
  title: 'Input',
  components: [
    {
      name: 'input', label: 'Input',
      controls: [
        { key: 'Size', type: 'select', options: ['Small', 'Medium', 'Large'], default: 'Medium' },
        { key: 'State', type: 'select', options: ["Live","Default","Focused","Filled","Error","Success","Disabled","Read-only"], default: 'Live' },
        { key: 'Value', type: 'text', default: 'Placeholder text', label: 'Value (placeholder in Live)' },
        { key: 'Leading Icon', type: 'bool', default: false },
        { key: 'Trailing Icon', type: 'bool', default: false, label: 'Trailing Icon (clear)' },
        { key: 'Counter', type: 'bool', default: false },
        { key: 'Counter Text', type: 'text', default: '0/80', when: (s) => s.Counter },
      ],
    },
  ],
});
