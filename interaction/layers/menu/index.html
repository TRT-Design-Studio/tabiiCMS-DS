/* Playground çerçevesi. Yapı ve hareket interaction/reference/sidebar/style.css ile aynı;
   değerler Sidebar, Nav Item ve Nav Sub Group spec'lerindeki token'lar. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg-surface); color: var(--text-primary); font: var(--text-sm-regular); -webkit-font-smoothing: antialiased; overflow: hidden; }
#app { height: 100%; }
:root { --pg-ease: cubic-bezier(0.32, 0.72, 0, 1); --pg-dur: 0.4s; --pg-fast: 0.15s; }

.pg-app { display: flex; height: 100vh; min-height: 560px; }

/* ---------- Sidebar (Type=Expanded, 248) ---------- */
.sidebar { flex: none; width: 248px; height: 100%; display: flex; flex-direction: column; background: var(--bg-base); border-right: 1px solid var(--border-default); }
.sb-header { flex: none; display: flex; align-items: center; height: 56px; padding: var(--spacing-3-5) var(--spacing-7); border-bottom: 1px solid var(--border-default); }
.logo { display: flex; align-items: center; gap: var(--spacing-2); border-radius: var(--rounded-md); }
.logo svg { display: block; flex: none; }
.logo:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

.sb-nav { flex: 1; min-height: 0; overflow: hidden auto; scrollbar-width: thin; display: flex; flex-direction: column; gap: var(--spacing-3); padding: var(--spacing-4); }
.sb-group { display: flex; flex-direction: column; gap: var(--spacing-0-5); }
.group-label { height: 28px; flex: none; display: flex; align-items: center; padding: var(--spacing-1-5) var(--spacing-2-5); }
.group-label p { margin: 0; font: var(--text-xs-medium); color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Nav Item, Level=Item */
.item { position: relative; flex: none; display: flex; align-items: center; gap: var(--spacing-2-5); width: 100%; height: 36px; padding: var(--spacing-2) var(--spacing-2-5); margin: 0; overflow: hidden;
  border: 1px solid transparent; border-radius: var(--rounded-lg); background: transparent; cursor: pointer; text-align: left;
  color: var(--text-secondary); font: var(--text-sm-medium); white-space: nowrap;
  transition: background-color var(--pg-fast) ease, color var(--pg-fast) ease; }
.item:hover { background: var(--bg-interactive-hover); color: var(--text-primary); }
.item:active { background: var(--bg-interactive-pressed); }
.item.selected { background: var(--bg-surface); border-color: var(--border-default); color: var(--text-primary); }
.item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--border-focus); }
.item .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.item .caret { flex: none; display: flex; }
.item .caret .tds-icon { transition: transform 0.2s ease-out; }
.item.closed .caret .tds-icon { transform: rotate(180deg); }

/* Nav Sub Group: açılır alan, içinde property kontrolleri */
.sub { display: grid; grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows var(--pg-dur) var(--pg-ease), opacity var(--pg-dur) var(--pg-ease); }
.sub.shut { grid-template-rows: 0fr; opacity: 0; pointer-events: none; visibility: hidden; transition: grid-template-rows var(--pg-dur) var(--pg-ease), opacity var(--pg-dur) var(--pg-ease), visibility 0s linear var(--pg-dur); }
.sub > div { min-height: 0; overflow: hidden; }
.sub-wrap { padding: var(--spacing-1-5) 0 var(--spacing-1-5) var(--spacing-4-5); }
.sub-list { display: flex; flex-direction: column; gap: var(--spacing-3); padding: var(--spacing-1) 0 var(--spacing-1) var(--spacing-2); border-left: 1px solid var(--border-default); }

/* Kontroller (Select Small ve Input Small görünümünde) */
.pg-field { display: flex; flex-direction: column; gap: var(--spacing-1); padding-left: var(--spacing-2); }
.pg-field > span:first-child, .pg-check > span { font: var(--text-xs-medium); color: var(--text-secondary); }
.pg-select { position: relative; display: flex; }
.pg-select .tds-icon { position: absolute; right: var(--spacing-2-5); top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
.pg-field select, .pg-field input { width: 100%; height: 32px; padding: 0 var(--spacing-2-5); font: var(--text-sm-regular); color: var(--text-primary); background: var(--bg-surface);
  border: 1px solid var(--border-default); border-radius: var(--rounded-md); appearance: none; -webkit-appearance: none; }
.pg-field select { padding-right: var(--spacing-8); cursor: pointer; }
.pg-field select:focus-visible, .pg-field input:focus-visible { outline: none; border-color: var(--border-selected); }
.pg-check { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-2); padding-left: var(--spacing-2); min-height: 24px; cursor: pointer; }
.pg-check input { appearance: none; -webkit-appearance: none; flex: none; width: 28px; height: 16px; margin: 0; border-radius: var(--rounded-full); background: var(--border-strong); position: relative; cursor: pointer; transition: background-color var(--pg-fast) ease; }
.pg-check input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: var(--rounded-full); background: var(--bg-surface); transition: transform var(--pg-fast) ease; }
.pg-check input:checked { background: var(--action-primary-default); }
.pg-check input:checked::after { transform: translateX(12px); background: var(--text-inverse); }
.pg-check input:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

.sb-footer { flex: none; padding: var(--spacing-4); border-top: 1px solid var(--border-default); }

/* ---------- Sahne ---------- */
.pg-stage { position: relative; flex: 1; min-width: 0; height: 100%; background: var(--bg-surface); outline: none; }
.pg-canvas { position: absolute; inset: 0; overflow: auto; display: grid; place-items: center; padding: var(--spacing-16); }
.pg-preview { position: relative; display: flex; align-items: center; justify-content: center; transform: scale(var(--zoom, 1)); transform-origin: center; transition: transform 0.2s var(--pg-ease); }

.pg-zoom { position: absolute; right: var(--spacing-4); bottom: var(--spacing-4); display: flex; align-items: center; gap: var(--spacing-0-5); padding: var(--spacing-0-5);
  background: var(--bg-raised); border-radius: var(--rounded-lg); box-shadow: inset 0 0 0 1px var(--border-default), var(--shadow-sm); }
.pg-zoom button { display: inline-flex; align-items: center; justify-content: center; height: 28px; min-width: 28px; padding: 0 var(--spacing-1-5); border: 0; margin: 0; border-radius: var(--rounded-md);
  background: transparent; color: var(--text-secondary); font: var(--text-xs-medium); cursor: pointer; transition: background-color var(--pg-fast) ease, color var(--pg-fast) ease; }
.pg-zoom button:hover:not(:disabled) { background: var(--bg-interactive-hover); color: var(--text-primary); }
.pg-zoom button:active:not(:disabled) { background: var(--bg-interactive-pressed); }
.pg-zoom button:disabled { opacity: var(--opacity-50); cursor: not-allowed; }
.pg-zoom button:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 0; }
.pg-zoom-value { min-width: 48px !important; font-variant-numeric: tabular-nums; }

/* ---------- Komponentlerin ortak parçaları ---------- */
.tds-icon { display: inline-flex; flex: none; width: 1em; height: 1em; font-size: 16px; line-height: 1; align-items: center; justify-content: center; }
.tds-icon svg { display: block; width: 1em; height: 1em; }
.tds-flag { display: inline-block; flex: none; border-radius: var(--rounded-full); }
/* Sahne örnekleri: kontrol + Label (Checkbox & Radio spec: 8 px aralık) */
.pg-choices { display: flex; flex-direction: column; gap: var(--spacing-3); }
.pg-choice { display: flex; align-items: flex-start; gap: var(--spacing-2); }
.pg-choice > .tds-checkbox, .pg-choice > .tds-radio { margin-top: var(--spacing-0-5); }
.tds-popover { position: absolute; z-index: 1000; animation: tds-pop-in var(--tds-motion-duration) var(--tds-motion-easing); }
@keyframes tds-pop-in { from { opacity: 0; transform: translateY(-4px); } }

  TDS.playground = function (mount, page) {
    const root = typeof mount === 'string' ? document.querySelector(mount) : mount;
    const state = {};
    page.components.forEach((c) => { state[c.name] = Object.fromEntries(c.controls.map((k) => [k.key, k.default])); });
    let active = page.components[0].name;
    const open = new Set([active]);
    let zoom = 1;

    const visible = (c, k) => !k.when || k.when(state[c.name]);
    const control = (c, k) => {
      const val = state[c.name][k.key];
      const id = `ctl-${c.name}-${slug(k.key)}`;
      const label = esc(k.label || k.key);
      if (k.type === 'bool') {
        return `<label class="pg-check" for="${id}"><span>${label}</span><input id="${id}" type="checkbox" role="switch" data-comp="${c.name}" data-key="${esc(k.key)}" ${val ? 'checked' : ''}></label>`;
      }
      if (k.type === 'select') {
        return `<label class="pg-field" for="${id}"><span>${label}</span><span class="pg-select">${'<select id="' + id + '" data-comp="' + c.name + '" data-key="' + esc(k.key) + '">'}${k.options.map((o) => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>${TDS.icon('CaretDown', 16)}</span></label>`;
      }
      return `<label class="pg-field" for="${id}"><span>${label}</span><input id="${id}" type="text" data-comp="${c.name}" data-key="${esc(k.key)}" value="${esc(val)}"></label>`;
    };
    const controls = (c) => c.controls.filter((k) => visible(c, k)).map((k) => control(c, k)).join('');

    const navItem = (c) => {
      const isOpen = open.has(c.name);
      return `<button type="button" class="item${c.name === active ? ' selected' : ''}${isOpen ? '' : ' closed'}" data-item="${c.name}" aria-expanded="${isOpen}" aria-controls="sub-${c.name}"${c.name === active ? ' aria-current="page"' : ''}>`
        + `<span class="text">${esc(c.label)}</span><span class="caret">${TDS.icon('CaretUp', 16)}</span></button>`
        + `<div class="sub${isOpen ? '' : ' shut'}" id="sub-${c.name}"><div><div class="sub-wrap"><div class="sub-list" data-controls="${c.name}">${controls(c)}</div></div></div></div>`;
    };

    const shell = () => {
      const dark = document.documentElement.dataset.theme === 'dark';
      root.innerHTML = `
        <div class="pg-app">
          <aside class="sidebar" aria-label="${esc(page.title)} components">
            <div class="sb-header"><a class="logo" href="#" aria-label="tabii CMS Design System" onclick="return false">${LOGO}</a></div>
            <nav class="sb-nav"><div class="sb-group">
              <div class="group-label"><p>${esc(page.title.toUpperCase())}</p></div>
              ${page.components.map(navItem).join('')}
            </div></nav>
            <div class="sb-footer">
              <button type="button" class="item" data-theme-toggle aria-pressed="${dark}">${TDS.icon(dark ? 'Sun' : 'Moon', 20)}<span class="text">${dark ? 'Light mode' : 'Dark mode'}</span></button>
            </div>
          </aside>
          <main class="pg-stage" aria-label="Preview" tabindex="-1">
            <div class="pg-canvas"><div class="pg-preview" data-tds-layer style="--zoom:${zoom}">${TDS.render(active, state[active])}</div></div>
            <div class="pg-zoom" role="group" aria-label="Zoom">
              <button type="button" data-zoom="out" aria-label="Zoom out"${zoom <= ZOOMS[0] ? ' disabled' : ''}>${TDS.icon('Minus', 16)}</button>
              <button type="button" data-zoom="reset" class="pg-zoom-value" aria-label="Reset zoom to 100%">${Math.round(zoom * 100)}%</button>
              <button type="button" data-zoom="in" aria-label="Zoom in"${zoom >= ZOOMS[ZOOMS.length - 1] ? ' disabled' : ''}>${TDS.icon('Plus', 16)}</button>
            </div>
          </main>
        </div>`;
    };

    // Sadece sahneyi yeniler (kontroller yerinde kalır, odak kaybolmaz).
    const renderStage = () => {
      TDS.closeMenu();
      root.querySelector('.pg-preview').innerHTML = TDS.render(active, state[active]);
    };
    const setZoom = (z) => {
      TDS.closeMenu();
      zoom = Math.min(ZOOMS[ZOOMS.length - 1], Math.max(ZOOMS[0], z));
      root.querySelector('.pg-preview').style.setProperty('--zoom', zoom);
      root.querySelector('.pg-zoom-value').textContent = `${Math.round(zoom * 100)}%`;
      root.querySelector('[data-zoom="out"]').disabled = zoom <= ZOOMS[0];
      root.querySelector('[data-zoom="in"]').disabled = zoom >= ZOOMS[ZOOMS.length - 1];
    };
    const step = (dir) => {
      const i = ZOOMS.findIndex((z) => z >= zoom - 1e-6);
      setZoom(dir > 0 ? ZOOMS[Math.min(ZOOMS.length - 1, ZOOMS[i] > zoom + 1e-6 ? i : i + 1)] : ZOOMS[Math.max(0, i - 1)]);
    };

    const refreshControls = (name) => {
      const c = page.components.find((x) => x.name === name);
      root.querySelector(`[data-controls="${name}"]`).innerHTML = controls(c);
    };

    root.addEventListener('click', (e) => {
      const item = e.target.closest('[data-item]');
      if (item) {
        const name = item.dataset.item;
        if (name !== active) {
          // Başka bir komponent seçildi: onu göster ve aç, diğerlerini kapat.
          active = name;
          for (const o of [...open]) {
            open.delete(o);
            const b = root.querySelector(`[data-item="${o}"]`);
            b.classList.add('closed'); b.setAttribute('aria-expanded', 'false');
            root.querySelector(`#sub-${o}`).classList.add('shut');
          }
          open.add(name);
          root.querySelectorAll('[data-item]').forEach((b) => {
            const on = b.dataset.item === name;
            b.classList.toggle('selected', on);
            if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
          });
          renderStage();
        } else if (open.has(name)) open.delete(name); else open.add(name);
        const isOpen = open.has(name);
        item.classList.toggle('closed', !isOpen);
        item.setAttribute('aria-expanded', String(isOpen));
        root.querySelector(`#sub-${name}`).classList.toggle('shut', !isOpen);
        return;
      }
      if (e.target.closest('[data-theme-toggle]')) {
        const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark';
        shell();
        return;
      }
      const z = e.target.closest('[data-zoom]');
      if (z) { if (z.dataset.zoom === 'reset') setZoom(1); else step(z.dataset.zoom === 'in' ? 1 : -1); }
    });
    root.addEventListener('input', (e) => {
      const el = e.target.closest('[data-key]');
      if (!el || el.type !== 'text') return;
      state[el.dataset.comp][el.dataset.key] = el.value;
      if (el.dataset.comp === active) renderStage();
    });
    root.addEventListener('change', (e) => {
      const el = e.target.closest('[data-key]');
      if (!el || el.type === 'text') return;
      const name = el.dataset.comp;
      state[name][el.dataset.key] = el.type === 'checkbox' ? el.checked : el.value;
      const focusKey = el.dataset.key;
      refreshControls(name); // "when" ile görünen kontroller değişebilir
      const again = root.querySelector(`[data-comp="${name}"][data-key="${focusKey}"]`);
      if (again) again.focus();
      if (name !== active) {
        active = name;
        root.querySelectorAll('[data-item]').forEach((b) => b.classList.toggle('selected', b.dataset.item === name));
      }
      renderStage();
    });
    // Sahnede Ctrl/⌘ + tekerlek veya + / − / 0 tuşları ile yakınlaştırma.
    root.addEventListener('wheel', (e) => {
      if (!(e.ctrlKey || e.metaKey) || !e.target.closest('.pg-stage')) return;
      e.preventDefault(); step(e.deltaY < 0 ? 1 : -1);
    }, { passive: false });
    window.addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('input, select, textarea')) return;
      if (e.key === '+' || e.key === '=') step(1);
      else if (e.key === '-') step(-1);
      else if (e.key === '0') setZoom(1);
    });

    shell();
  };
})();

// menu-item
// Menu Item. Menü içinde role="menuitem" olarak çizilir; klavye ve tıklama core.js'te.
TDS.register('menu-item', {
  defaults: { State: 'Live', Destructive: 'False', Label: 'Menu item', 'Show Description': false, Description: 'Description', 'Leading Icon': false, Icon: 'Copy', 'Show Trailing Text': false, 'Trailing Text': '⌘D', Submenu: false, Check: false, leading: '', value: '' },
  render(p) {
    const st = p.State && p.State !== 'Live' ? TDS.slug(p.State) : '';
    const destructive = p.Destructive === 'True';
    const disabled = st === 'disabled';
    // İkon boyutları spec'teki Icons tablosundan (Leading Icon 16, Submenu 16).
    const sz = (part) => TDS.num(TDS.spec('menu-item', 'Icons', 'part', part).size);
    // leading: Leading slot içeriği (HTML): bayrak, Checkbox, Radio, avatar…
    const lead = p.leading ? `<span class="tds-menu-item-leading">${p.leading}</span>`
      : p['Leading Icon'] ? TDS.icon(p.Icon, sz('Leading Icon'), 'Regular', 'data-part="leading-icon"') : '';
    const desc = p['Show Description'] ? `<span class="tds-menu-item-desc">${TDS.esc(p.Description)}</span>` : '';
    const trailing = p['Show Trailing Text'] ? `<span class="tds-menu-item-trailing">${TDS.esc(p['Trailing Text'])}</span>` : '';
    const check = p.Check || st === 'selected' ? TDS.icon('Check', sz('Submenu'), 'Regular', 'data-part="submenu"') : '';
    const sub = p.Submenu ? TDS.icon('CaretRight', sz('Submenu'), 'Regular', 'data-part="submenu"') : '';
    return `<div role="menuitem" tabindex="-1" class="tds-menu-item"${st ? ` data-state="${st}"` : ''}${destructive ? ' data-destructive="true"' : ''}${disabled ? ' aria-disabled="true"' : ''}${p.Submenu ? ' aria-haspopup="menu"' : ''}${p.value ? ` data-value="${TDS.esc(p.value)}"` : ''}>`
      + lead + `<span class="tds-menu-item-text"><span class="tds-menu-item-label">${TDS.esc(p.Label)}</span>${desc}</span>` + trailing + check + sub + `</div>`;
  },
});

// menu-group-label
// Menu Group Label.
TDS.register('menu-group-label', {
  defaults: { Label: 'Group' },
  render(p) { return `<div class="tds-menu-group-label" role="presentation">${TDS.esc(p.Label)}</div>`; },
});

// menu-separator
// Menu Separator.
TDS.register('menu-separator', {
  defaults: {},
  render() { return `<div class="tds-menu-separator" role="separator"></div>`; },
});

// badge-count
// Badge Count. 99'dan büyük sayılar 99+ olarak gösterilir (spec).
TDS.register('badge-count', {
  defaults: { Tone: 'Neutral', Count: '5' },
  render(p) {
    const n = Number(p.Count);
    const text = Number.isFinite(n) && n > 99 ? '99+' : p.Count;
    return `<span class="tds-badge-count" data-tone="${TDS.slug(p.Tone)}">${TDS.esc(text)}</span>`;
  },
});

// button
// Button. Badge Count'u (Show Count) kendisi çizmez, badge-count komponentini kullanır.
// İç kullanım için ek props: iconLeft / iconRight (ikon adı), before (ikonun yerine HTML, ör. bayrak),
// menu (TDS.defineMenu adı, tıklayınca açılır), align (menünün hizası), attrs (ek nitelikler).
TDS.register('button', {
  defaults: { Variant: 'Primary', Size: 'Medium', State: 'Live', Label: 'Button', 'Icon Left': false, 'Icon Right': false, 'Show Count': false, Count: '5', corners: '', iconLeft: 'Plus', iconRight: 'CaretDown', before: '', menu: '', align: '', attrs: '' },
  render(p) {
    // İkon boyutu spec'teki Sizes tablosundan (Icon sütunu): XSmall 14, Small 16, Medium 16, Large 20.
    const size = TDS.num(TDS.spec('button', 'Sizes', 'size', p.Size).icon);
    const icon = (n) => TDS.icon(n, size);
    const state = p.State && p.State !== 'Live' ? ` data-state="${TDS.slug(p.State)}"` : '';
    const dis = p.State === 'Disabled' ? ' disabled' : '';
    const corners = p.corners ? ` data-corners="${p.corners}"` : '';
    const menu = p.menu ? ` data-tds-menu="${p.menu}" aria-haspopup="menu" aria-expanded="false"${p.align ? ` data-tds-align="${p.align}"` : ''}` : '';
    return `<button type="button" class="tds-button" data-variant="${TDS.slug(p.Variant)}" data-size="${TDS.slug(p.Size)}"${state}${corners}${menu}${p.attrs ? ' ' + p.attrs : ''}${dis}>`
      + (p.before || (p['Icon Left'] ? icon(p.iconLeft) : ''))
      + `<span class="tds-button-label">${TDS.esc(p.Label)}</span>`
      + (p['Show Count'] ? TDS.render('badge-count', { Tone: 'Neutral', Count: p.Count }) : '')
      + (p['Icon Right'] ? icon(p.iconRight) : '')
      + `</button>`;
  },
});

// menu
// Menu. Items slot'u menu-item, menu-group-label ve menu-separator komponentleriyle çizilir.
// Items: [{ Label, Icon, Destructive, ... } | { group: 'Başlık' } | { separator: true }]
TDS.register('menu', {
  defaults: {
    State: 'Default',
    Width: 240,
    Items: [{ Label: 'Menu item' }, { Label: 'Menu item' }, { Label: 'Menu item' }, { Label: 'Menu item' }],
    Title: 'No results for "xyzq"',
    Description: 'Check the spelling or search by Content ID.',
    ErrorTitle: "Couldn't load results",
    ErrorDescription: 'Check your connection and try again.',
    Hint: 'Type at least 2 characters',
    label: 'Options',
  },
  render(p) {
    const st = TDS.slug(p.State);
    let body = '';
    if (st === 'default') {
      body = p.Items.map((it) => it.separator ? TDS.render('menu-separator', {})
        : it.group ? TDS.render('menu-group-label', { Label: it.group })
          : TDS.render('menu-item', { ...it, 'Leading Icon': !!it.Icon, Destructive: it.Destructive ? 'True' : 'False' })).join('');
    } else if (st === 'loading') {
      body = `<div class="tds-menu-status" aria-busy="true" aria-label="Loading">${[208, 166, 125].map((w) => `<span class="tds-menu-skeleton" style="width:${w}px"></span>`).join('')}</div>`;
    } else if (st === 'no-results') {
      body = `<div class="tds-menu-status"><span class="tds-menu-status-title">${TDS.esc(p.Title)}</span><span class="tds-menu-status-desc">${TDS.esc(p.Description)}</span></div>`;
    } else if (st === 'error') {
      const errSize = TDS.num(TDS.spec('menu', 'States', 'state', 'Error', 1).icon); // 20
      body = `<div class="tds-menu-status" role="alert">${TDS.icon('WarningCircle', errSize)}<span class="tds-menu-status-title">${TDS.esc(p.ErrorTitle)}</span><span class="tds-menu-status-desc">${TDS.esc(p.ErrorDescription)}</span>${TDS.render('button', { Variant: 'Secondary', Size: 'Small', Label: 'Try again' })}</div>`;
    } else if (st === 'hint') {
      body = `<div class="tds-menu-status"><span class="tds-menu-hint">${TDS.esc(p.Hint)}</span></div>`;
    }
    return `<div class="tds-menu" role="menu" aria-label="${TDS.esc(p.label)}" data-state="${st}" style="width:${Number(p.Width) || 240}px">${body}</div>`;
  },
});

// icon-button
// Icon Button. Button'un renk sınıfını (tds-button) paylaşır.
TDS.register('icon-button', {
  defaults: { Variant: 'Primary', Shape: 'Square', Size: 'Medium', State: 'Live', Icon: 'MagnifyingGlass', label: 'Search', corners: '', menu: '', align: '' },
  render(p) {
    const state = p.State && p.State !== 'Live' ? ` data-state="${TDS.slug(p.State)}"` : '';
    const dis = p.State === 'Disabled' ? ' disabled' : '';
    const corners = p.corners ? ` data-corners="${p.corners}"` : '';
    // menu: TDS.defineMenu ile tanımlanmış bir menünün adı; verilirse tıklayınca o menü açılır.
    const menu = p.menu ? ` data-tds-menu="${p.menu}" aria-haspopup="menu" aria-expanded="false"${p.align ? ` data-tds-align="${p.align}"` : ''}` : '';
    const size = TDS.num(TDS.spec('icon-button', 'Sizes', 'size', p.Size).icon); // 16 / 16 / 20 / 20
    return `<button type="button" class="tds-button tds-icon-button" aria-label="${TDS.esc(p.label)}" data-variant="${TDS.slug(p.Variant)}" data-shape="${TDS.slug(p.Shape)}" data-size="${TDS.slug(p.Size)}"${state}${corners}${menu}${dis}>${TDS.icon(p.Icon, size)}</button>`;
  },
});

// page
// Menu sayfasının playground'u: Menu (liste durumları) ve Menu Item (satır).
// "Open from a button" sekmesi menünün bir tetikleyiciden açılışını gösterir.
TDS.defineMenu('menu-demo', {
  label: 'Row actions',
  Items: [
    { group: 'Show' },
    { Label: 'Edit', Icon: 'PencilSimple', 'Show Trailing Text': true, 'Trailing Text': '⌘E' },
    { Label: 'Duplicate', Icon: 'Copy', 'Show Trailing Text': true, 'Trailing Text': '⌘D' },
    { Label: 'Move to', Icon: 'FolderSimple', Submenu: true },
    { separator: true },
    { Label: 'Delete', Icon: 'Trash', Destructive: true },
  ],
});
TDS.register('menu-trigger-demo', {
  defaults: { Size: 'Medium' },
  render(p) {
    return TDS.render('icon-button', { Variant: 'Secondary', Size: p.Size, Icon: 'DotsThree', label: 'Row actions', menu: 'menu-demo', align: 'end' });
  },
});
TDS.playground('#app', {
  title: 'Menu',
  components: [
    {
      name: 'menu', label: 'Menu',
      controls: [
        { key: 'State', type: 'select', options: ['Default', 'Loading', 'No Results', 'Error', 'Hint'], default: 'Default' },
        { key: 'Width', type: 'text', default: '240', label: 'Width (px)' },
      ],
    },
    {
      name: 'menu-item', label: 'Menu Item',
      controls: [
        { key: 'State', type: 'select', options: ['Live', 'Default', 'Hover', 'Focused', 'Selected', 'Disabled'], default: 'Live' },
        { key: 'Destructive', type: 'select', options: ['False', 'True'], default: 'False', label: 'Destructive (Default, Hover, Focused)' },
        { key: 'Label', type: 'text', default: 'Menu item' },
        { key: 'Show Description', type: 'bool', default: false },
        { key: 'Description', type: 'text', default: 'Description', when: (s) => s['Show Description'] },
        { key: 'Leading Icon', type: 'bool', default: false },
        { key: 'Icon', type: 'select', options: TDS.iconNames(), default: 'Copy', label: 'Leading Icon Swap', when: (s) => s['Leading Icon'] },
        { key: 'Show Trailing Text', type: 'bool', default: false },
        { key: 'Trailing Text', type: 'text', default: '⌘D', when: (s) => s['Show Trailing Text'] },
        { key: 'Submenu', type: 'bool', default: false },
      ],
    },
    {
      name: 'menu-trigger-demo', label: 'Open from a button',
      controls: [{ key: 'Size', type: 'select', options: ['XSmall', 'Small', 'Medium', 'Large'], default: 'Medium' }],
    },
  ],
});
